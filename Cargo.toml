[package]
name = "mind"
version = "0.1.0"
edition = "2021"
description = "A Git-backed store for ideas and todos, inspired by password-store"

[[bin]]
name = "mind"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
colored = "2"
dialoguer = "0.11"
walkdir = "2"
